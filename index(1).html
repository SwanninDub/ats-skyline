<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local Time and Weather</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
html,body{height:100%;margin:0;background:transparent}
.ats-sky{position:relative;container-type:inline-size;box-sizing:border-box;height:100%;overflow:hidden;border:1.5px solid #C8D2DD;border-radius:12px;background:#0B2550;font-family:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;color:#FFFFFF}
.ats-sky p.nojs{margin:0;padding:18px 22px;font-size:14px;color:#DCE6F2}
.ats-sky canvas{position:absolute;top:0;left:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.ats-sky .beacon{position:absolute;width:3px;height:3px;margin:-1px 0 0 -1px;background:#FF3B30;border-radius:0;box-shadow:0 0 6px 2px rgba(255,59,48,.85),0 0 16px 6px rgba(255,59,48,.35);animation:ats-beacon 2.4s steps(1,end) infinite}
@keyframes ats-beacon{0%{opacity:1}45%{opacity:.18}}
.ats-sky .pn{position:absolute;top:10px;right:10px;bottom:10px;width:33%;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;padding:10px 16px;border-radius:6px;-webkit-backdrop-filter:blur(10px) saturate(140%);backdrop-filter:blur(10px) saturate(140%);background:rgba(255,255,255,.48);color:#002955;border:1px solid rgba(255,255,255,.6);transition:background-color 1.2s ease,color 1.2s ease}
.ats-sky.dark .pn{background:rgba(6,20,48,.34);color:#FFFFFF;border-color:rgba(255,255,255,.16)}
.ats-sky .row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.ats-sky .loc{font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;opacity:.8;white-space:nowrap}
.ats-sky .dt{font-size:12px;opacity:.85;white-space:nowrap}
.ats-sky .tm{display:block;font-size:34px;font-weight:500;line-height:1;letter-spacing:-.01em;white-space:nowrap}
.ats-sky .ap{margin-left:4px;font-size:15px;font-weight:500;letter-spacing:0}
.ats-sky .wx{display:flex;align-items:center;gap:10px;padding-top:7px;border-top:1px solid rgba(0,41,85,.14)}
.ats-sky.dark .wx{border-top-color:rgba(255,255,255,.18)}
.ats-sky .tp{font-size:22px;font-weight:500;line-height:1}
.ats-sky .cd{font-size:12px;font-weight:600;white-space:nowrap}
.ats-sky .hl{font-size:11px;opacity:.8;white-space:nowrap}
@container (max-width:620px){.ats-sky .pn{width:48%;padding:9px 12px}.ats-sky .tm{font-size:28px}.ats-sky .ap{font-size:13px}.ats-sky .dt{display:none}}
@container (max-width:420px){.ats-sky .pn{top:auto;left:8px;right:8px;bottom:8px;width:auto;flex-direction:row;align-items:center;padding:7px 12px}.ats-sky .row:first-child{display:none}.ats-sky .tm{font-size:22px}.ats-sky .wx{padding-top:0;border-top-width:0}.ats-sky .hl{display:none}}
@media (prefers-reduced-motion:reduce){.ats-sky .beacon{animation:none}.ats-sky .pn{transition:none}}
</style>
</head>
<body>
<div class="ats-sky" data-lat="40.71" data-lon="-74.01" data-place="New York" role="img" aria-label="Pixel-art city skyline under a sky that changes with the time of day, with the local time, date and New York weather">
<p class="nojs">Local time and weather</p>
</div>
<script>
(function(){
var box=document.querySelector('.ats-sky');
var q=new URLSearchParams(location.search);
['lat','lon','place'].forEach(function(k){if(q.get(k))box.setAttribute('data-'+k,q.get(k))});
var lat=parseFloat(box.dataset.lat),lon=parseFloat(box.dataset.lon),place=box.dataset.place;
var PX=3; // CSS pixels per art pixel

var MONTHS=['Jan.','Feb.','March','April','May','June','July','Aug.','Sept.','Oct.','Nov.','Dec.'];
var DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var WX={0:'Clear',1:'Mostly Clear',2:'Partly Cloudy',3:'Cloudy',45:'Fog',48:'Fog',51:'Drizzle',53:'Drizzle',55:'Drizzle',56:'Freezing Drizzle',57:'Freezing Drizzle',61:'Rain',63:'Rain',65:'Heavy Rain',66:'Freezing Rain',67:'Freezing Rain',71:'Snow',73:'Snow',75:'Heavy Snow',77:'Snow',80:'Showers',81:'Showers',82:'Heavy Showers',85:'Snow Showers',86:'Snow Showers',95:'Thunderstorms',96:'Thunderstorms',99:'Thunderstorms'};
var CLOUDY=new Set([2,3,45,48,51,53,55,56,57,61,63,65,66,67,71,73,75,77,80,81,82,85,86,95,96,99]);
var WET=new Set([51,53,55,61,63,65,80,81,82,95,96,99]);
var SNOW=new Set([71,73,75,77,85,86]);
var code=null;

function hx(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
function mixA(a,b,t){return [0,1,2].map(function(i){return a[i]+(b[i]-a[i])*t})}
function mix(a,b,t){return mixA(hx(a),hx(b),t)}
function rgb(c){return 'rgb('+c.map(Math.round).join(',')+')'}
function clamp(v,a,b){return Math.min(b,Math.max(a,v))}
function rng(seed){var s=seed;return function(){s=(s*16807)%2147483647;return (s-1)/2147483646}}
var BAYER=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];

function sunTimes(d){
  var start=new Date(d.getFullYear(),0,0),doy=Math.floor((d-start)/864e5);
  var dec=23.44*Math.sin(2*Math.PI*(284+doy)/365)*Math.PI/180,phi=lat*Math.PI/180;
  var h=Math.acos(clamp(-Math.tan(phi)*Math.tan(dec),-1,1))*180/Math.PI/15+.15;
  var jan=new Date(d.getFullYear(),0,1).getTimezoneOffset(),jul=new Date(d.getFullYear(),6,1).getTimezoneOffset();
  var noon=11.85+(d.getTimezoneOffset()===Math.max(jan,jul)?0:1);
  return {rise:noon-h,set:noon+h,noon:noon};
}
// sky keyframes: [hour, zenith, upper, lower, horizon, darkness]
function keys(s){return [
  [s.rise-1.3,'#060F2A','#0B1C46','#16295C','#24386E',1],
  [s.rise-0.5,'#0E1A48','#2C2F6E','#6A4F8E','#C7779A',.8],
  [s.rise+0.15,'#29437F','#7A6FA8','#E7909C','#FFC27F',.4],
  [s.rise+1.3,'#3D84D6','#6FAEEA','#A9D6F5','#E9F6FD',0],
  [s.noon,'#2F79D9','#5FA7EE','#9CD2F6','#DDF2FC',0],
  [s.set-1.2,'#3F74C2','#7DA6DA','#F2C08C','#FFE0A8',.06],
  [s.set-0.15,'#2E3478','#7A4F94','#E2708A','#FFA25E',.45],
  [s.set+0.55,'#121E52','#2F3A82','#6A4F95','#C27390',.78],
  [s.set+1.4,'#060F2A','#0B1C46','#16295C','#24386E',1]
]}
function skyAt(hr,s){
  var k=keys(s);
  if(hr<k[0][0]||hr>=k[k.length-1][0])return {c:k[0].slice(1,5),dark:1};
  var i=0;k.forEach(function(kk,j){if(hr>=kk[0])i=j});
  var a=k[i],b=k[i+1],t=(hr-a[0])/(b[0]-a[0]);t=t*t*(3-2*t);
  return {c:[1,2,3,4].map(function(n){var c=mix(a[n],b[n],t);return '#'+c.map(function(v){return ('0'+Math.round(v).toString(16)).slice(-2)}).join('')}),dark:a[5]+(b[5]-a[5])*t};
}

Array.from(box.querySelectorAll('p.nojs')).forEach(function(p){p.remove()});
var cv=document.createElement('canvas');box.appendChild(cv);
var ctx=cv.getContext('2d');
var beacon=document.createElement('span');beacon.className='beacon';beacon.setAttribute('aria-hidden','true');box.appendChild(beacon);
var pn=document.createElement('div');pn.className='pn';
pn.innerHTML='<div class="row"><span class="loc"></span><span class="dt"></span></div><span class="tm"><span class="tv"></span><span class="ap"></span></span><div class="wx"><span class="tp">--</span><span><span class="cd">Loading weather</span><br><span class="hl"></span></span></div>';
box.appendChild(pn);
var $=function(c){return pn.querySelector('.'+c)};
$('loc').textContent=place;

var W=0,H=0;
function build(){
  W=Math.ceil(box.clientWidth/PX);H=Math.ceil(box.clientHeight/PX);
  cv.width=W;cv.height=H;
}

// fixed city layout in art pixels, generated once per width
var city=null;
function makeCity(){
  var R=rng(11),bs=[],x=-2,ground=H,vx=W*.42;
  // far layer
  var far=[];x=-3;
  while(x<W){var w=4+Math.floor(R()*6),h=Math.round(H*(.10+R()*.12));far.push({x:x,w:w,h:h});x+=w-1}
  // near layer with one hero spire
  var spireX=Math.round(W*.30);
  x=-2;
  while(x<W){
    var w=5+Math.floor(R()*7),h=Math.round(H*(.13+R()*.15)),cap=['','','step','mast','','slant'][Math.floor(R()*6)];
    if(x<=spireX&&x+w>spireX){w=7;h=Math.round(H*.42);cap='spire'}
    var wins=[];for(var yy=2;yy<h-1;yy+=2)for(var xx=1;xx<w-1;xx+=2)wins.push([xx,yy,R()]);
    bs.push({x:x,w:w,h:h,cap:cap,wins:wins});x+=w+(R()<.3?1:0);
  }
  var stars=[];for(var i=0;i<Math.round(W*H/70);i++)stars.push([Math.floor(R()*W),Math.floor(R()*H*.72),R()]);
  var drops=[];for(var j=0;j<Math.round(W/3);j++)drops.push([Math.floor(R()*W),Math.floor(R()*H)]);
  city={far:far,near:bs,stars:stars,drops:drops,vx:vx};
}
// perspective lean: looking up, verticals converge toward a point high above
function lean(xc,yFromGround){return (city.vx-xc)*yFromGround/(H*1.7)}

function px(x,y,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),1,1)}
function span(x0,x1,y,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x0),y,Math.max(1,Math.round(x1)-Math.round(x0)),1)}
function building(b,col,winOn,winOff,dark,withWins){
  var xc=b.x+b.w/2;
  for(var r=0;r<b.h;r++){var y=H-1-r,o=lean(xc,r);span(b.x+o,b.x+b.w+o,y,col)}
  var top=H-b.h,ot=lean(xc,b.h);
  if(b.cap==='step'){for(var r2=0;r2<2;r2++)span(b.x+1+ot,b.x+b.w-1+ot,top-1-r2,col);span(b.x+2+ot,b.x+b.w-2+ot,top-3,col)}
  if(b.cap==='mast'){for(var m=1;m<5;m++)px(xc+ot,top-m,col)}
  if(b.cap==='slant'){for(var s2=1;s2<4;s2++)span(b.x+ot+s2*2,b.x+b.w+ot,top-s2,col)}
  if(b.cap==='spire'){span(b.x+1+ot,b.x+b.w-1+ot,top-1,col);span(b.x+2+ot,b.x+b.w-2+ot,top-2,col);span(b.x+2+ot,b.x+b.w-2+ot,top-3,col);for(var m2=4;m2<12;m2++)px(xc-.5+lean(xc,b.h+m2),top-m2,col);b.tip=[xc-.5+lean(xc,b.h+12),top-12]}
  if(withWins)b.wins.forEach(function(w){var on=w[2]>1-(.15+.45*dark);var c=on?winOn:winOff;if(!c)return;var r=w[1];px(b.x+w[0]+lean(xc,r),H-1-r,c)});
}

function paint(){
  var d=new Date(),hr=d.getHours()+d.getMinutes()/60,s=sunTimes(d),k=skyAt(hr,s),dark=k.dark;
  var cloudy=code!==null&&CLOUDY.has(code),grey=cloudy?(code===2?.18:.45):0;
  var stops=k.c.map(function(c){return mixA(hx(c),mix('#8C99AB','#232C40',dark),grey)});
  // dithered banded sky
  var img=ctx.createImageData(W,H),data=img.data,N=11;
  function skyCol(t){var seg=t*3,i=Math.min(2,Math.floor(seg));return mixA(stops[i],stops[i+1],seg-i)}
  var band=[];for(var b=0;b<=N;b++)band.push(skyCol(b/N));
  for(var y=0;y<H;y++){var t=y/(H-1)*N,lo=Math.floor(t),fr=t-lo;
    for(var x=0;x<W;x++){var th=(BAYER[y%4][x%4]+.5)/16,c=band[Math.min(N,fr>th?lo+1:lo)],o=(y*W+x)*4;data[o]=c[0];data[o+1]=c[1];data[o+2]=c[2];data[o+3]=255}}
  ctx.putImageData(img,0,0);
  // stars
  var sa=Math.pow(dark,1.6)*(cloudy?.3:1);
  if(sa>.02)city.stars.forEach(function(st){var a=sa*(.35+.65*st[2]);px(st[0],st[1],'rgba(255,255,255,'+a.toFixed(2)+')');if(st[2]>.93&&a>.5){px(st[0]-1,st[1],'rgba(255,255,255,'+(a*.35).toFixed(2)+')');px(st[0]+1,st[1],'rgba(255,255,255,'+(a*.35).toFixed(2)+')');px(st[0],st[1]-1,'rgba(255,255,255,'+(a*.35).toFixed(2)+')');px(st[0],st[1]+1,'rgba(255,255,255,'+(a*.35).toFixed(2)+')')}});
  // sun or moon on a high arc
  var isDay=hr>s.rise-.3&&hr<s.set+.3,p;
  if(isDay)p=clamp((hr-s.rise+.3)/(s.set-s.rise+.6),0,1);
  else{var len=24-(s.set-s.rise)-.6,since=hr-(s.set+.3);if(since<0)since+=24;p=clamp(since/len,0,1)}
  var usable=W*.52,ox=W*.05+p*usable,oy=H*.82-Math.sin(p*Math.PI)*H*.66,low=1-Math.sin(p*Math.PI);
  var R0=isDay?4:3,core=isDay?rgb(mix('#FFF6D2','#FFB46E',low)):'#F3F0E3',haloA=isDay?(cloudy?.15:.35):.22*dark;
  for(var gy=-R0-4;gy<=R0+4;gy++)for(var gx=-R0-4;gx<=R0+4;gx++){var dd=Math.sqrt(gx*gx+gy*gy);
    if(dd<=R0+.3){px(ox+gx,oy+gy,core);if(!isDay&&((gx===1&&gy===-1)||(gx===-1&&gy===1)||(gx===0&&gy===2)))px(ox+gx,oy+gy,'#D2CDBB')}
    else if(dd<=R0+4&&haloA>.02&&BAYER[(oy+gy+64)%4|0][(ox+gx+64)%4|0]<(1-(dd-R0)/4)*9){px(ox+gx,oy+gy,isDay?'rgba(255,236,190,'+haloA+')':'rgba(220,230,255,'+haloA+')')}}
  // pixel clouds tinted by the sky
  var cTint=rgb(mixA(mixA(hx('#FFFFFF'),stops[3],.35),hx('#3A4766'),dark*.8));
  var cShade=rgb(mixA(mixA(hx('#C9D3E3'),stops[2],.45),hx('#26304A'),dark*.8));
  var clouds=cloudy?[[.12,.22,14,3],[.38,.12,18,3],[.62,.3,16,3],[.85,.16,12,2],[.25,.42,10,2]]:[[.2,.18,12,2],[.58,.34,9,1]];
  clouds.forEach(function(c){var cx=c[0]*W,cy=c[1]*H,w=c[2],h=c[3];
    for(var yy=0;yy<=h;yy++){var half=w*(1-Math.pow(yy/(h+1),2))*(yy===0?.75:1);span(cx-half+yy,cx+half-yy*.5,cy+yy,yy===h?cShade:cTint)}
    span(cx-w*.35,cx+w*.15,cy-1,cTint);});
  // far haze layer picks up the horizon color
  var farCol=rgb(mixA(mixA(hx('#4F6488'),stops[3],.45),hx('#14224A'),dark*.7));
  city.far.forEach(function(b){building(b,farCol,null,null,dark,false)});
  // near layer
  var nearCol=rgb(mixA(mix('#2C4466','#060E24',dark),stops[3],.08));
  var winOn=rgb(mix('#FFE3A0','#FFD27A',dark)),winOff=dark<.3?'rgba(200,225,250,'+(.35*(1-dark)).toFixed(2)+')':null;
  var tip=null;
  city.near.forEach(function(b){building(b,nearCol,dark>.15?winOn:null,winOff,dark,true);if(b.tip)tip=b.tip});
  // precipitation
  if(code!==null&&(WET.has(code)||SNOW.has(code))){var sn=SNOW.has(code);
    city.drops.forEach(function(dp,i){if(sn)px(dp[0],dp[1],'rgba(255,255,255,.9)');else{px(dp[0],dp[1],'rgba(205,224,245,.7)');px(dp[0]-1,dp[1]+1,'rgba(205,224,245,.5)')}})}
  // aircraft warning light on the spire
  if(tip){beacon.style.left=((tip[0]+.5)*PX)+'px';beacon.style.top=((tip[1]+.5)*PX)+'px';beacon.style.display='block'}
  box.classList.toggle('dark',dark>.5);
  // text
  var h12=d.getHours()%12||12;
  $('tv').textContent=h12+':'+('0'+d.getMinutes()).slice(-2);
  $('ap').textContent=d.getHours()<12?'a.m.':'p.m.';
  $('dt').textContent=DAYS[d.getDay()]+', '+MONTHS[d.getMonth()]+' '+d.getDate();
}

function weather(){
  var url='https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&timezone=auto&forecast_days=1';
  fetch(url).then(function(r){return r.json()}).then(function(j){
    code=j.current.weather_code;
    $('tp').textContent=Math.round(j.current.temperature_2m)+'°';
    $('cd').textContent=WX[code]||'';
    $('hl').textContent='H:'+Math.round(j.daily.temperature_2m_max[0])+'°  L:'+Math.round(j.daily.temperature_2m_min[0])+'°';
    paint();
  }).catch(function(){$('cd').textContent='Weather unavailable'});
}
function resize(){build();makeCity();paint()}
resize();weather();
new ResizeObserver(function(){var w=Math.ceil(box.clientWidth/PX),h=Math.ceil(box.clientHeight/PX);if(w!==W||h!==H)resize()}).observe(box);
setInterval(paint,20000);setInterval(weather,1800000);
})();
</script>
</body>
</html>
