<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local Time and Weather</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
html,body{height:100%;margin:0;background:transparent}
.ats-sky{position:relative;container-type:inline-size;box-sizing:border-box;height:100%;overflow:hidden;border:1.5px solid #C8D2DD;border-radius:12px;background:#0B2550;font-family:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;color:#FFFFFF}
.ats-sky p.nojs{margin:0;padding:24px;font-size:14px;color:#DCE6F2}
.ats-sky svg.scene{position:absolute;top:0;left:0;width:100%;height:100%;display:block}
.ats-sky .pn{position:absolute;top:12px;right:12px;bottom:12px;width:38%;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;padding:16px 18px;border-radius:9px;-webkit-backdrop-filter:blur(14px) saturate(140%);backdrop-filter:blur(14px) saturate(140%);background:rgba(255,255,255,.58);color:#002955;border:1px solid rgba(255,255,255,.55);transition:background-color 1.2s ease,color 1.2s ease}
.ats-sky.dark .pn{background:rgba(6,20,48,.42);color:#FFFFFF;border-color:rgba(255,255,255,.16)}
.ats-sky .loc{display:block;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.ats-sky .tm{display:block;margin-top:2px;font-size:40px;font-weight:500;line-height:1.05;letter-spacing:-.01em;white-space:nowrap}
.ats-sky .ap{margin-left:5px;font-size:17px;font-weight:500;letter-spacing:0}
.ats-sky .dt{display:block;margin-top:4px;font-size:14px;opacity:.85}
.ats-sky .wx{display:flex;align-items:center;gap:12px;padding-top:10px;border-top:1px solid rgba(0,41,85,.14)}
.ats-sky.dark .wx{border-top-color:rgba(255,255,255,.18)}
.ats-sky .tp{font-size:30px;font-weight:500;line-height:1}
.ats-sky .cd{display:block;font-size:13px;font-weight:600}
.ats-sky .hl{display:block;margin-top:2px;font-size:12px;opacity:.8}
@container (max-width:620px){.ats-sky .pn{width:46%;padding:14px}.ats-sky .tm{font-size:32px}.ats-sky .ap{font-size:14px}.ats-sky .tp{font-size:24px}}
@container (max-width:440px){.ats-sky .pn{top:auto;left:10px;right:10px;bottom:10px;width:auto;flex-direction:row;align-items:flex-end;padding:10px 14px}.ats-sky .loc,.ats-sky .dt{display:none}.ats-sky .tm{font-size:26px}.ats-sky .wx{padding-top:0;border-top-width:0}}
@media (prefers-reduced-motion:reduce){.ats-sky .pn{transition:none}}

</style>
</head>
<body>
<div class="ats-sky" data-lat="40.71" data-lon="-74.01" data-place="New York" role="img" aria-label="City skyline that changes with the time of day, with the local time, date and New York weather">
<p class="nojs">Local time and weather</p>
</div>
<script>
(function(){var q=new URLSearchParams(location.search),b=document.querySelector('.ats-sky');['lat','lon','place'].forEach(function(k){if(q.get(k)){b.setAttribute('data-'+k,q.get(k))}})})();
(function(){
var NS='http://www.w3.org/2000/svg';
function lt(a,b){return Math.min(a,b)===a?a!==b:false}
function gt(a,b){return lt(b,a)}
function clamp(v,a,b){return Math.min(b,Math.max(a,v))}
function times(n,fn){Array.from({length:n}).forEach(function(_,i){fn(i)})}
function el(tag,at,par){var e=document.createElementNS(NS,tag);Object.keys(at||{}).forEach(function(k){e.setAttribute(k,at[k])});if(par){par.appendChild(e)}return e}
function hx(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
function mix(a,b,t){var x=hx(a),y=hx(b);return '#'+[0,1,2].map(function(i){return ('0'+Math.round(x[i]+(y[i]-x[i])*t).toString(16)).slice(-2)}).join('')}
function rng(seed){var s=seed;return function(){s=(s*16807)%2147483647;return (s-1)/2147483646}}
var MONTHS=['Jan.','Feb.','March','April','May','June','July','Aug.','Sept.','Oct.','Nov.','Dec.'];
var DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var WX={0:'Clear',1:'Mostly Clear',2:'Partly Cloudy',3:'Cloudy',45:'Fog',48:'Fog',51:'Drizzle',53:'Drizzle',55:'Drizzle',56:'Freezing Drizzle',57:'Freezing Drizzle',61:'Rain',63:'Rain',65:'Heavy Rain',66:'Freezing Rain',67:'Freezing Rain',71:'Snow',73:'Snow',75:'Heavy Snow',77:'Snow',80:'Showers',81:'Showers',82:'Heavy Showers',85:'Snow Showers',86:'Snow Showers',95:'Thunderstorms',96:'Thunderstorms',99:'Thunderstorms'};
var CLOUDY={2:1,3:1,45:1,48:1,51:1,53:1,55:1,56:1,57:1,61:1,63:1,65:1,66:1,67:1,71:1,73:1,75:1,77:1,80:1,81:1,82:1,85:1,86:1,95:1,96:1,99:1};
var WET={51:1,53:1,55:1,61:1,63:1,65:1,80:1,81:1,82:1,95:1,96:1,99:1};
var SNOW={71:1,73:1,75:1,77:1,85:1,86:1};

function sunTimes(d,lat){
  var start=new Date(d.getFullYear(),0,0),doy=Math.floor((d-start)/864e5);
  var dec=23.44*Math.sin(2*Math.PI*(284+doy)/365)*Math.PI/180,phi=lat*Math.PI/180;
  var h=Math.acos(clamp(-Math.tan(phi)*Math.tan(dec),-1,1))*180/Math.PI/15+.15;
  var jan=new Date(d.getFullYear(),0,1).getTimezoneOffset(),jul=new Date(d.getFullYear(),6,1).getTimezoneOffset();
  var noon=11.85+(d.getTimezoneOffset()===Math.max(jan,jul)?0:1);
  return {rise:noon-h,set:noon+h,noon:noon};
}
function keys(s){
  return [
    [s.rise-1.2,'#081838','#14295A','#2A3F72',1],
    [s.rise-0.4,'#13245A','#4A4785','#A77598',.75],
    [s.rise+0.2,'#3A5C9E','#D88FA0','#F8BE86',.35],
    [s.rise+1.4,'#5FA8E8','#A3D2F2','#E8F5FC',0],
    [s.noon,'#3E8EE0','#8CC6F0','#DDF1FB',0],
    [s.set-1.1,'#5288C8','#F0B27F','#FBDDA6',.08],
    [s.set-0.1,'#3E4388','#D6708A','#F6A36B',.45],
    [s.set+0.6,'#17295F','#3B4A8E','#7C6AA6',.8],
    [s.set+1.4,'#081838','#14295A','#2A3F72',1]
  ];
}
function skyAt(hr,s){
  var k=keys(s),first=k[0],last=k[k.length-1];
  if(lt(hr,first[0])||gt(hr,last[0])){return {c:[first[1],first[2],first[3]],dark:1}}
  var i=0;
  k.forEach(function(kk,j){if(gt(hr,kk[0])||hr===kk[0]){i=j}});
  var a=k[i],b=k[Math.min(i+1,k.length-1)],t=b[0]===a[0]?0:(hr-a[0])/(b[0]-a[0]);
  t=t*t*(3-2*t);
  return {c:[mix(a[1],b[1],t),mix(a[2],b[2],t),mix(a[3],b[3],t)],dark:a[4]+(b[4]-a[4])*t};
}

function build(box){
  if(box.getAttribute('data-ready')){return}
  box.setAttribute('data-ready','1');
  var lat=parseFloat(box.getAttribute('data-lat')||'40.71'),lon=parseFloat(box.getAttribute('data-lon')||'-74.01');
  var place=box.getAttribute('data-place')||'New York';
  Array.from(box.querySelectorAll('p.nojs')).forEach(function(p){p.parentNode.removeChild(p)});
  var W=600,H=210,R=rng(7);
  var svg=el('svg',{'class':'scene',viewBox:'0 0 '+W+' '+H,preserveAspectRatio:'xMinYMax slice','aria-hidden':'true',focusable:'false'},box);
  var defs=el('defs',{},svg),uid='s'+Math.floor(Math.random()*1e6);
  var g=el('linearGradient',{id:uid+'g',x1:'0',y1:'0',x2:'0',y2:'1'},defs);
  var st=[el('stop',{offset:'0'},g),el('stop',{offset:'.6'},g),el('stop',{offset:'1'},g)];
  var glow=el('radialGradient',{id:uid+'r'},defs);
  var gs1=el('stop',{offset:'0','stop-opacity':'.9'},glow),gs2=el('stop',{offset:'1','stop-opacity':'0'},glow);
  el('rect',{x:0,y:0,width:W,height:H,fill:'url(#'+uid+'g)'},svg);
  var stars=el('g',{},svg);
  times(46,function(){el('circle',{cx:(R()*W).toFixed(1),cy:(R()*H*.55).toFixed(1),r:(R()*.9+.35).toFixed(2),fill:'#FFFFFF',opacity:(R()*.6+.4).toFixed(2)},stars)});
  var orbGlow=el('circle',{r:34,fill:'url(#'+uid+'r)'},svg);
  var orb=el('circle',{r:11},svg);
  var clouds=el('g',{},svg);
  [[90,46,1],[250,30,.8],[390,58,1.1],[520,36,.9]].forEach(function(c){
    var cg=el('g',{transform:'translate('+c[0]+' '+c[1]+') scale('+c[2]+')'},clouds);
    [[0,0,26,9],[-16,4,16,7],[18,3,18,8],[4,-6,15,8]].forEach(function(e){el('ellipse',{cx:e[0],cy:e[1],rx:e[2],ry:e[3]},cg)});
  });
  var far=el('g',{},svg),near=el('g',{},svg),wins=el('g',{},svg),precip=el('g',{},svg);
  var x=-4;
  times(60,function(){if(gt(x,W)){return}var w=14+Math.floor(R()*20),h=46+Math.floor(R()*70);el('rect',{x:x,y:H-h,width:w,height:h},far);x+=w-2});
  var lit=[];
  function tower(x0,w,h,cap){
    el('rect',{x:x0,y:H-h,width:w,height:h},near);
    if(cap==='spire'){el('rect',{x:x0+w*.3,y:H-h-14,width:w*.4,height:14},near);el('rect',{x:x0+w*.45,y:H-h-46,width:w*.1,height:32},near)}
    if(cap==='step'){el('rect',{x:x0+3,y:H-h-10,width:w-6,height:10},near);el('rect',{x:x0+7,y:H-h-18,width:w-14,height:8},near)}
    if(cap==='slant'){el('polygon',{points:x0+','+(H-h)+' '+(x0+w)+','+(H-h-16)+' '+(x0+w)+','+(H-h)},near)}
    if(cap==='mast'){el('rect',{x:x0+w/2-1,y:H-h-20,width:2,height:20},near)}
    var cols=Math.floor((w-6)/6),rows=Math.floor((h-12)/8);
    times(rows,function(r){times(cols,function(c){var on=R();lit.push([el('rect',{x:x0+4+c*6,y:H-h+8+r*8,width:3,height:4},wins),on])})});
  }
  var caps=['','step','','mast','','slant','spire','','step','','mast','','slant',''];
  x=-6;
  times(40,function(i){if(gt(x,W)){return}var cap=caps[i%caps.length],w=22+Math.floor(R()*22),h=56+Math.floor(R()*72);if(cap==='spire'){w=30;h=150}x+=Math.floor(R()*4);tower(x,w,h,cap);x+=w+1});
  var pn=document.createElement('div');pn.className='pn';
    function sp(cls,par,txt){var s=document.createElement('span');s.className=cls;if(txt){s.textContent=txt}par.appendChild(s);return s}
  var top=document.createElement('div');pn.appendChild(top);
  sp('loc',top,place);
  var tm=sp('tm',top),tmv=document.createTextNode(''),ap=document.createElement('span');ap.className='ap';tm.appendChild(tmv);tm.appendChild(ap);
  var dt=sp('dt',top);
  var wx=sp('wx',pn),tp=sp('tp',wx,'--'),wr=sp('',wx),cd=sp('cd',wr,'Loading weather'),hl=sp('hl',wr,'');
  box.appendChild(pn);
  var code=0,wxOk=false;

  function paint(){
    var d=new Date(),hr=d.getHours()+d.getMinutes()/60,s=sunTimes(d,lat),k=skyAt(hr,s),dark=k.dark;
    var grey=wxOk?(CLOUDY[code]?(code===2?.2:.5):0):0;st.forEach(function(stop,i){stop.setAttribute('stop-color',mix(k.c[i],mix('#8C99AB','#2A3448',dark),grey))});
    stars.setAttribute('opacity',(Math.pow(dark,2)*(wxOk?(CLOUDY[code]?.25:1):1)).toFixed(2));
    var isDay=gt(hr,s.rise-.3)?lt(hr,s.set+.3):false,p,ox,oy;
    if(isDay){p=clamp((hr-s.rise+.3)/(s.set-s.rise+.6),0,1)}
    else{var len=24-(s.set-s.rise)-.6,since=hr-(s.set+.3);if(lt(since,0)){since+=24}p=clamp(since/len,0,1)}
    ox=40+p*(W-300);oy=135-Math.sin(p*Math.PI)*82;
    orb.setAttribute('cx',ox);orb.setAttribute('cy',oy);orbGlow.setAttribute('cx',ox);orbGlow.setAttribute('cy',oy);
    var low=1-Math.sin(p*Math.PI);
    if(isDay){orb.setAttribute('fill',mix('#FFF4C9','#FFB26B',low));orb.setAttribute('r',11);gs1.setAttribute('stop-color',mix('#FFF1B8','#FF9E5E',low));orbGlow.setAttribute('opacity',wxOk?(CLOUDY[code]?.35:1):1);orb.setAttribute('opacity',wxOk?(CLOUDY[code]?.45:1):1)}
    else{orb.setAttribute('fill','#F2EFE2');orb.setAttribute('r',9);gs1.setAttribute('stop-color','#DCE6FF');orbGlow.setAttribute('opacity',(.5*dark).toFixed(2));orb.setAttribute('opacity',(.95*dark*(wxOk?(CLOUDY[code]?.4:1):1)).toFixed(2))}
    far.setAttribute('fill',mix('#8EA8C6','#1A2C55',dark));
    near.setAttribute('fill',mix('#3B5A80','#07132B',dark));
    lit.forEach(function(w){var on=gt(w[1],1-(.18+.42*dark));w[0].setAttribute('fill',dark===0?'#CFE2F5':(on?'#FFD98A':'#9DB5D3'));w[0].setAttribute('opacity',on?(.15+.8*dark).toFixed(2):(.22*(1-dark)).toFixed(2))});
    clouds.setAttribute('fill',mix('#FFFFFF','#3A4C78',dark));
    clouds.setAttribute('opacity',wxOk?(CLOUDY[code]?(code===3?.95:.7):0):0);
    box.className=box.className.replace(/ ?dark/g,'')+(gt(dark,.5)?' dark':'');
    var h12=d.getHours()%12||12;
    tmv.nodeValue=h12+':'+('0'+d.getMinutes()).slice(-2);
    ap.textContent=lt(d.getHours(),12)?'a.m.':'p.m.';
    dt.textContent=DAYS[d.getDay()]+', '+MONTHS[d.getMonth()]+' '+d.getDate();
    precip.setAttribute('opacity',wxOk?(WET[code]||SNOW[code]?1:0):0);
  }
  times(34,function(){var px=R()*(W-200),py=R()*H;if(R()){el('line',{x1:px,y1:py,x2:px-3,y2:py+9,stroke:'#CFE0F5','stroke-width':'1','stroke-opacity':'.55','class':'rain'},precip)}});
  function weather(){
    var url='https://api.open-meteo.com/v1/forecast?'+['latitude='+lat,'longitude='+lon,'current=temperature_2m,weather_code','daily=temperature_2m_max,temperature_2m_min','temperature_unit=fahrenheit','timezone=auto','forecast_days=1'].join(String.fromCharCode(38));
    fetch(url).then(function(r){return r.json()}).then(function(j){
      code=j.current.weather_code;wxOk=true;
      tp.textContent=Math.round(j.current.temperature_2m)+'°';
      cd.textContent=WX[code]||'';
      hl.textContent='H:'+Math.round(j.daily.temperature_2m_max[0])+'°  L:'+Math.round(j.daily.temperature_2m_min[0])+'°';
      if(SNOW[code]){Array.from(precip.querySelectorAll('line')).forEach(function(l){l.setAttribute('x2',l.getAttribute('x1'));l.setAttribute('y2',parseFloat(l.getAttribute('y1'))+2);l.setAttribute('stroke-width','2.4');l.setAttribute('stroke-linecap','round');l.setAttribute('stroke-opacity','.85')})}
      paint();
    }).catch(function(){cd.textContent='Weather unavailable';tp.textContent='--'});
  }
  paint();weather();
  setInterval(paint,20000);setInterval(weather,1800000);
}
function init(){Array.from(document.querySelectorAll('.ats-sky')).forEach(build)}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',init)}else{init()}
})();

</script>
</body>
</html>
